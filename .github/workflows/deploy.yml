name: Deploy

# Sem ambiente de homolog aqui, só produção — deploy direto em push na main.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, falveshub-server]
    steps:
      - name: Atualizar código
        shell: pwsh
        working-directory: C:\Servidor\briefing-app
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Rebuild e restart dos containers
        shell: pwsh
        working-directory: C:\Servidor\briefing-app
        run: docker compose up -d --build

      - name: Healthcheck
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $resp = Invoke-WebRequest -Uri "http://localhost:8081" -UseBasicParsing -TimeoutSec 20
          if ($resp.StatusCode -ne 200) { throw "Healthcheck falhou: HTTP $($resp.StatusCode)" }
          Write-Host "OK - HTTP $($resp.StatusCode)"
