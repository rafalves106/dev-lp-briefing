name: Deploy

# Sem ambiente de homolog aqui, só produção - deploy direto em push na main.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, macOS, falveshub-server]
    steps:
      - name: Atualizar código
        working-directory: /Users/falves/Dev/Servidor/briefing-app
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Rebuild e restart dos containers
        working-directory: /Users/falves/Dev/Servidor/briefing-app
        run: docker compose up -d --build

      - name: Healthcheck
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081")
          if [ "$code" != "200" ]; then echo "Healthcheck falhou: HTTP $code" >&2; exit 1; fi
          echo "OK - HTTP $code"
