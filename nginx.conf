upstream app {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 100m;

  # código próprio do app — muda a cada deploy, nunca cachear como immutable
  location ~* ^/assets/(js/app\.js|js/admin\.js|style\.min\.css)$ {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # libs de terceiros e fontes — conteúdo nunca muda no mesmo path, cache agressivo
  location ~* \.(?:js|css|woff2|webp|svg)$ {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
