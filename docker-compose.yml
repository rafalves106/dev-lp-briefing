services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/app/server/data
      - uploads-data:/app/server/uploads
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  db-data:
  uploads-data:
